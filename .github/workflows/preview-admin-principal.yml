name: Preview admin principal parity

on:
  push:
    branches:
      - agent/preview-admin-principal

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preview-admin-principal
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Corrigir previa da administracao principal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Trecho esperado não encontrado em {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          replace('app/page.tsx',
            'type FounderPerspective = "fundadora" | "publico" | "pesquisador" | "observador" | "candidato" | "supervisor" | "coordenador" | "administrador";',
            'type FounderPerspective = "fundadora" | "primario" | "publico" | "pesquisador" | "observador" | "candidato" | "supervisor" | "coordenador" | "administrador";')

          replace('app/page.tsx',
            'const isFounderAccount = (profile?: Profile | null) => Boolean(profile?.role === "admin" && (profile.is_primary_admin === true || profile.admin_level === "founder"));',
            'const isFounderAccount = (profile?: Profile | null) => Boolean(profile?.role === "admin" && (profile.is_primary_admin === true || profile.admin_level === "founder"));\nconst ownPrincipalPerspective = (profile?: Profile | null): FounderPerspective => profile?.role === "admin" && profile.admin_level === "primary" ? "primario" : "fundadora";')

          replace('app/page.tsx',
            '    setSession(current);\n    setProfile(p);',
            '    setSession(current);\n    setProfile(p);\n    if (hasPrincipalAdminAccess(p)) setFounderPerspective(ownPrincipalPerspective(p));')

          replace('app/page.tsx',
            '    if (founderPerspective === "administrador") role = "admin";\n    else if (founderPerspective === "candidato") role = "observador";',
            '    if (founderPerspective === "fundadora" || founderPerspective === "primario" || founderPerspective === "administrador") role = "admin";\n    else if (founderPerspective === "candidato") role = "observador";')

          replace('app/page.tsx',
            '    if (destino === "instrutoria" && hasPrincipalAdminAccess(profile) && founderPerspective === "fundadora") {',
            '    if (destino === "instrutoria" && hasPrincipalAdminAccess(profile) && founderPerspective === ownPrincipalPerspective(profile)) {')

          replace('app/page.tsx',
            '  const founderAccess = hasPrincipalAdminAccess(profile);\n  const previewing = founderAccess && founderPerspective !== "fundadora";\n  const visualProfile: Profile = previewing && founderPerspective !== "publico"\n    ? {\n        ...profile,\n        role: founderPerspective === "administrador" ? "admin" : founderPerspective === "candidato" ? "observador" : founderPerspective,\n        observer_mode: founderPerspective === "candidato" ? "candidato" : founderPerspective === "observador" ? "geral" : profile.observer_mode,\n        is_primary_admin: false,\n        admin_level: founderPerspective === "administrador" ? "secondary" : null,\n      } as Profile\n    : profile;\n  const leavePreview = () => {\n    setFounderPerspective("fundadora");',
            '  const founderAccess = hasPrincipalAdminAccess(profile);\n  const currentPrincipalPerspective = ownPrincipalPerspective(profile);\n  const previewing = founderAccess && founderPerspective !== currentPrincipalPerspective;\n  const visualProfile: Profile = previewing && founderPerspective !== "publico"\n    ? {\n        ...profile,\n        role: founderPerspective === "fundadora" || founderPerspective === "primario" || founderPerspective === "administrador" ? "admin" : founderPerspective === "candidato" ? "observador" : founderPerspective,\n        observer_mode: founderPerspective === "candidato" ? "candidato" : founderPerspective === "observador" ? "geral" : profile.observer_mode,\n        is_primary_admin: founderPerspective === "fundadora",\n        admin_level: founderPerspective === "fundadora" ? "founder" : founderPerspective === "primario" ? "primary" : founderPerspective === "administrador" ? "secondary" : null,\n      } as Profile\n    : profile;\n  const leavePreview = () => {\n    setFounderPerspective(currentPrincipalPerspective);')

          replace('app/page.tsx',
            '{previewing && <FounderPreviewBar label={founderPerspective === "pesquisador" ? "Pesquisador" : founderPerspective === "supervisor" ? "Supervisor" : founderPerspective === "coordenador" ? "Coordenador" : "Administrador secundário"} voltar={leavePreview} />}',
            '{previewing && <FounderPreviewBar label={founderPerspective === "fundadora" ? "Administradora fundadora" : founderPerspective === "primario" ? "Administrador primário" : founderPerspective === "pesquisador" ? "Pesquisador" : founderPerspective === "supervisor" ? "Supervisor" : founderPerspective === "coordenador" ? "Coordenador" : "Administrador secundário"} voltar={leavePreview} />}')

          replace('app/page.tsx',
            '{campo && <button className="sair-campo" onClick={() => previewing ? leavePreview() : admin ? ir("inicio") : sair()}>{previewing ? "Voltar ao painel da fundadora" : admin ? "Sair da prévia" : "Sair"}</button>}',
            '{campo && <button className="sair-campo" onClick={() => previewing ? leavePreview() : admin ? ir("inicio") : sair()}>{previewing ? "Voltar ao meu painel" : admin ? "Sair da prévia" : "Sair"}</button>}')

          replace('app/page.tsx',
            '    { perspective: "fundadora", icon: "NP", title: "Administradora fundadora", description: "Controle principal, visão total, códigos e áreas protegidas.", access: "principal" },\n    { perspective: "publico", icon: "⌂", title: "Capa pública",',
            '    { perspective: "fundadora", icon: "NP", title: "Administradora fundadora", description: "Controle principal, visão total e conta protegida contra remoção.", access: "principal" },\n    { perspective: "primario", icon: "AP", title: "Administrador primário", description: "Mesma visão operacional da Fundadora, sem poder remover, suspender ou rebaixar a Fundadora.", access: "principal" },\n    { perspective: "publico", icon: "⌂", title: "Capa pública",')

          replace('app/page.tsx',
            '<div><small>TODAS AS ÁREAS DA FUNDAÇÃO</small><h3>Abrir uma página do seu painel</h3>',
            '<div><small>TODAS AS ÁREAS DA ADMINISTRAÇÃO PRINCIPAL</small><h3>Abrir uma página do seu painel</h3>')

          replace('app/page.tsx',
            'aviso("A prévia não altera a sua conta fundadora.")',
            'aviso("A prévia não altera a sua conta principal.")')

          replace('public/sw.js', 'nortep-pesquisa-v57', 'nortep-pesquisa-v58')
          replace('app/layout.tsx', 'nortep-reload-v57', 'nortep-reload-v58')
          replace('app/layout.tsx', '/sw.js?v=57', '/sw.js?v=58')
          PY
      - name: Verificar
        run: |
          npm audit
          npm run build
      - name: Salvar correcao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/layout.tsx public/sw.js
          git commit -m 'Adicionar previa do Administrador Primario'
          git push origin HEAD:agent/preview-admin-principal
