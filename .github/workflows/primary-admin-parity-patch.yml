name: Primary admin parity final patch

on:
  push:
    branches: [agent/primary-admin-founder-parity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/primary-admin-founder-parity
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Finalize primary-admin parity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          text=p.read_text()
          old='''<div className="boas"><div><small>{currentProfile.is_primary_admin ? "CENTRAL DA ADMINISTRADORA FUNDADORA" : currentProfile.role === "coordenador" ? "PAINEL DA COORDENAÇÃO DE CAMPO" : "PAINEL ADMINISTRATIVO"}</small><h2>Olá, {currentProfile.name.split(" ")[0]}. <span>O campo está avançando.</span></h2><p>{currentProfile.is_primary_admin ? "Você possui o acesso principal protegido e a visão completa da operação." : currentProfile.role === "coordenador" ? "Acompanhe a equipe de campo, o ritmo e as ocorrências da coleta." : "Acompanhe a operação sem compartilhar a senha da conta fundadora."}</p></div>'''
          new='''<div className="boas"><div><small>{isFounderAccount(currentProfile) ? "CENTRAL DA ADMINISTRADORA FUNDADORA" : currentProfile.role === "admin" && currentProfile.admin_level === "primary" ? "CENTRAL DO ADMINISTRADOR PRIMÁRIO" : currentProfile.role === "coordenador" ? "PAINEL DA COORDENAÇÃO DE CAMPO" : "PAINEL ADMINISTRATIVO"}</small><h2>Olá, {currentProfile.name.split(" ")[0]}. <span>O campo está avançando.</span></h2><p>{hasPrincipalAdminAccess(currentProfile) ? "Você possui acesso principal protegido e a visão completa da operação." : currentProfile.role === "coordenador" ? "Acompanhe a equipe de campo, o ritmo e as ocorrências da coleta." : "Acompanhe a operação sem compartilhar credenciais da administração principal."}</p></div>'''
          if old not in text: raise SystemExit('Inicio principal block not found')
          text=text.replace(old,new)
          old='''return <><Cabecalho titulo="Ecossistema NorteP" sub="Política, povo e pesquisa em uma operação integrada." botao={profile.is_primary_admin ? "Abrir Instrutoria" : profile.role === "supervisor" ? "Abrir aulas" : ""} acao={profile.is_primary_admin ? abrirInstrutoria : abrirAcademia} /><div className="ecos-grid">{produtos.map((p, i) => {
    const academy = i === 1;
    const academyAvailable = profile.is_primary_admin || profile.role === "supervisor";
    const active = i === 0 || (academy && academyAvailable);
    return <article className={`${active ? "eco ativo" : "eco"}${academy ? " ecos-academy-card" : ""}`} key={p[0]}><i>{i === 0 ? "NP" : academy ? "N+" : "◇"}</i><label>{academy && !academyAvailable ? "Pesquisa e Supervisão" : p[1]}</label><h3>{p[0]}</h3><p>{academy ? profile.is_primary_admin ? "Planos, exemplos e materiais da instrutora para Pesquisa e Supervisão." : profile.role === "supervisor" ? "Suas aulas e exercícios fazem parte deste mesmo acesso." : "As aulas são exclusivas dos perfis Pesquisador e Supervisor." : p[2]}</p>{i === 0 ? <button>Produto atual</button> : academy && profile.is_primary_admin ? <button onClick={abrirInstrutoria}>Abrir instrutoria →</button> : academy && profile.role === "supervisor" ? <button onClick={abrirAcademia}>Abrir aulas →</button> : academy ? <button disabled>Sem aulas neste perfil</button> : <button disabled>Planejado</button>}</article>;'''
          new='''return <><Cabecalho titulo="Ecossistema NorteP" sub="Política, povo e pesquisa em uma operação integrada." botao={hasPrincipalAdminAccess(profile) ? "Abrir Instrutoria" : profile.role === "supervisor" ? "Abrir aulas" : ""} acao={hasPrincipalAdminAccess(profile) ? abrirInstrutoria : abrirAcademia} /><div className="ecos-grid">{produtos.map((p, i) => {
    const academy = i === 1;
    const academyAvailable = hasPrincipalAdminAccess(profile) || profile.role === "supervisor";
    const active = i === 0 || (academy && academyAvailable);
    return <article className={`${active ? "eco ativo" : "eco"}${academy ? " ecos-academy-card" : ""}`} key={p[0]}><i>{i === 0 ? "NP" : academy ? "N+" : "◇"}</i><label>{academy && !academyAvailable ? "Pesquisa e Supervisão" : p[1]}</label><h3>{p[0]}</h3><p>{academy ? hasPrincipalAdminAccess(profile) ? "Planos, exemplos e materiais da instrutora para Pesquisa e Supervisão." : profile.role === "supervisor" ? "Suas aulas e exercícios fazem parte deste mesmo acesso." : "As aulas são exclusivas dos perfis Pesquisador e Supervisor." : p[2]}</p>{i === 0 ? <button>Produto atual</button> : academy && hasPrincipalAdminAccess(profile) ? <button onClick={abrirInstrutoria}>Abrir instrutoria →</button> : academy && profile.role === "supervisor" ? <button onClick={abrirAcademia}>Abrir aulas →</button> : academy ? <button disabled>Sem aulas neste perfil</button> : <button disabled>Planejado</button>}</article>;'''
          if old not in text: raise SystemExit('Ecossistema block not found')
          text=text.replace(old,new)
          text=text.replace('''{p.role === "observador" && p.observer_mode === "candidato" ? "Candidato · painel estratégico" : roleLabel(p.role)}{p.is_primary_admin && <small className="primary-admin-label">Conta principal</small>}''','''{p.role === "observador" && p.observer_mode === "candidato" ? "Candidato · painel estratégico" : p.role === "admin" && p.admin_level === "primary" ? "Administrador Primário" : roleLabel(p.role)}{isFounderAccount(p) && <small className="primary-admin-label">Fundadora protegida</small>}{p.role === "admin" && p.admin_level === "primary" && <small className="primary-admin-label">Administração principal</small>}''')
          text=text.replace('''{p.is_primary_admin ? "Protegida" : "Seu acesso"}''','''{isFounderAccount(p) ? "Fundadora protegida" : p.id === currentProfile.id ? "Seu acesso" : "Protegido"}''')
          p.write_text(text)
          PY
      - name: Verify
        run: |
          npm audit
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "Completar visao principal do Administrador Primario"
          git push origin HEAD:agent/primary-admin-founder-parity
