name: Cleanup unused tooling

on:
  push:
    branches: [agent/pilot-security-quality]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pilot-security-quality
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Remove tooling not used by the Next.js production app
        run: |
          npm uninstall --save-dev @cloudflare/vite-plugin @vitejs/plugin-react @vitejs/plugin-rsc drizzle-kit react-server-dom-webpack vinext vite wrangler
          npm pkg delete scripts.dev:sites scripts.build:sites scripts.start:sites scripts.db:generate
          npm audit fix || true
      - name: Verify runtime security
        run: npm audit --omit=dev --audit-level=high
      - name: Verify application build
        run: npm run build
      - name: Commit lockfile cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remover ferramental legado vulneravel"
          git push origin HEAD:agent/pilot-security-quality
