name: Primary admin label
on:
  push:
    branches:
      - agent/primary-admin-founder-parity
permissions:
  contents: write
jobs:
  label:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/primary-admin-founder-parity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Corrigir rotulo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          old='''{p.role === "observador" && p.observer_mode === "candidato" ? "Candidato · painel estratégico" : roleLabel(p.role)}{p.is_primary_admin && <small className="primary-admin-label">Conta principal</small>}'''
          new='''{p.role === "observador" && p.observer_mode === "candidato" ? "Candidato · painel estratégico" : p.role === "admin" && p.admin_level === "primary" ? "Administrador Primário" : roleLabel(p.role)}{isFounderAccount(p) && <small className="primary-admin-label">Fundadora protegida</small>}{p.role === "admin" && p.admin_level === "primary" && <small className="primary-admin-label">Administração principal</small>}'''
          if old not in s: raise SystemExit('Rotulo esperado nao encontrado')
          s=s.replace(old,new)
          old='''{p.is_primary_admin ? "Protegida" : "Seu acesso"}'''
          new='''{isFounderAccount(p) ? "Fundadora protegida" : p.id === currentProfile.id ? "Seu acesso" : "Protegido"}'''
          if old not in s: raise SystemExit('Protecao esperada nao encontrada')
          p.write_text(s.replace(old,new))
          PY
      - run: npm audit
      - run: npm run build
      - name: Salvar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git commit -m 'Identificar Administrador Primario na equipe'
          git push origin HEAD:agent/primary-admin-founder-parity
